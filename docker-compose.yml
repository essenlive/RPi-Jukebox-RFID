version: '2.1'

services:
  # Balena WiFi Connect block for WiFi configuration via hotspot
  wifi-connect:
    image: balenablocks/wifi-connect:latest
    restart: unless-stopped
    network_mode: host
    privileged: true

    labels:
      io.balena.features.dbus: '1'
      io.balena.features.firmware: '1'

    environment:
      # WiFi Connect configuration
      PORTAL_SSID: Phoniebox_Setup      # Hotspot name
      PORTAL_PASSPHRASE: PlayItLoud     # Hotspot password (min 8 chars)
      ACTIVITY_TIMEOUT: 0                # Keep portal open indefinitely
      CHECK_CONN_FREQ: 60                # Check connection every 60s

  # Balena Audio block for audio output (ALSA, PulseAudio, Bluetooth)
  audio:
    image: balenablocks/audio:latest
    privileged: true
    restart: unless-stopped

    ports:
      - "4317:4317"  # PulseAudio TCP

    labels:
      io.balena.features.dbus: '1'
      io.balena.features.bluetooth: '1'

    environment:
      # Audio block configuration
      AUDIO_OUTPUT: AUTO  # AUTO, ALSA, or Bluetooth device
      AUDIO_LOG_LEVEL: info

  # Phoniebox main application
  phoniebox:
    build: ./phoniebox
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      - wifi-connect
      - audio

    volumes:
      - 'phoniebox-data:/home/phoniebox/RPi-Jukebox-RFID/shared'
      - 'mpd-data:/var/lib/mpd'
      - 'phoniebox-logs:/home/phoniebox/RPi-Jukebox-RFID/logs'

    devices:
      - "/dev/gpiomem:/dev/gpiomem"

    cap_add:
      - SYS_RAWIO

    labels:
      io.balena.features.kernel-modules: '1'
      io.balena.features.firmware: '1'
      io.balena.features.dbus: '1'
      io.balena.features.sysfs: '1'
      io.balena.features.procfs: '1'
      io.balena.features.supervisor-api: '1'

    environment:
      - PULSE_SERVER=tcp:audio:4317
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - UDEV=1

volumes:
  phoniebox-data:
  mpd-data:
  phoniebox-logs:
